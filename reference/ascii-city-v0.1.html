<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII City — прототип</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; display: block; }
  #screen { width: 100%; height: 100%; }
  /* Дешёвый bloom: уменьшенная копия кадра, размытая и наложенная в режиме screen */
  #glow { width: 100%; height: 100%; pointer-events: none;
          filter: blur(7px) brightness(1.5); mix-blend-mode: screen; opacity: .6; }
  /* Лёгкие «строки развёртки» ЭЛТ-монитора */
  #scan { position: absolute; inset: 0; pointer-events: none;
          background: repeating-linear-gradient(rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="glow"></canvas>
<div id="scan"></div>
<script>
'use strict';
/* ============================================================================
   ASCII CITY — прототип
   Мир — сетка тайлов. Камера — raycaster (как Wolfenstein 3D), но вместо
   пикселей пишет в сетку символов: (символ, палитра, яркость).
   Затем сетка рисуется на canvas через атлас глифов (drawImage из кэша).

   Структура:
     CONFIG / PALETTE  — все настройки стиля и мира
     generateCity()    — процедурный город
     castColumn()      — raycasting одного столбца: небо, земля, фасады
     shade*()          — «шейдеры»: какой символ и цвет у поверхности
     sprites           — машины и пешеходы (billboard-спрайты с z-буфером)
     present()         — вывод сетки символов на экран
   ========================================================================== */

// ---------------------------------------------------------------- НАСТРОЙКИ
const CONFIG = {
  targetCols: 180,        // ширина экрана в символах (как в ASCII City)
  fov: Math.PI / 2.7,     // угол обзора
  maxDist: 64,            // дальность прорисовки, в тайлах
  eye: 0.17,              // высота глаз (1 тайл ≈ 10 м)
  floorH: 0.35,           // высота этажа
  mapSize: 112,           // размер карты (кратен block); карта зациклена
  block: 14,              // размер квартала вместе с дорогой
  road: 4,                // ширина дороги: тротуар, 2 полосы, тротуар
  walkSpeed: 1.4,
  runMul: 3,
  turnSpeed: 2.2,
  mouseSens: 0.0025,
  cars: 46,
  peds: 70,
  rainDrops: 280,
  seed: 2077,
};

// Палитра: стиль задаётся ограниченным набором цветов × 16 уровней яркости
const PALETTE = [
  [235, 235, 245], // 0  белый
  [255,  60, 170], // 1  неон-розовый
  [ 40, 230, 255], // 2  циан
  [175,  95, 255], // 3  фиолетовый
  [255, 180,  60], // 4  янтарный
  [110, 255, 140], // 5  зелёный
  [255,  60,  60], // 6  красный
  [ 70, 130, 255], // 7  синий
  [ 90,  60, 160], // 8  небо
  [120, 130, 160], // 9  асфальт
  [255, 225, 150], // 10 тёплый свет окон
];
const P = { WHITE:0, PINK:1, CYAN:2, VIOLET:3, AMBER:4, GREEN:5, RED:6, BLUE:7, SKY:8, ASPHALT:9, WARM:10 };
const BUILDING_HUES = [P.PINK, P.CYAN, P.VIOLET, P.AMBER, P.BLUE, P.CYAN, P.PINK, P.GREEN];
const SIGN_WORDS = ['HOTEL', 'RAMEN', 'BAR', 'NEON', 'CLUB', '2077', 'DATA', 'SUSHI', 'CYBER', 'OPEN', 'BAR24', 'NOODLE'];

// Символы, которыми рисуется мир — меняйте, чтобы менять стиль
const G = {
  lit: '#', litAlt: '=', dark: '.', wall: '.', pillar: '|', slab: '_', trim: '=',
  shop: '#', tree: ['&', '%', '*', '@'], grass: ['"', ','],
  sidewalk: '.', sidewalkSeam: '+', asphalt: '.', laneV: '|', laneH: '-', zebra: '=',
  star: ['.', '*', '+'], skyHaze: '.', moon: ['@', '%', '#', 'O'], rain: '|',
};
const code = s => s.charCodeAt(0);
const SPACE = 32;

// ---------------------------------------------------------------- УТИЛИТЫ
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash3(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clampLvl = v => v <= 0 ? 0 : v >= 15 ? 15 : v | 0;
const frac = v => v - Math.floor(v);

// ---------------------------------------------------------------- МИР
const N = CONFIG.mapSize, B = CONFIG.block, R = CONFIG.road;
const tiles = new Uint16Array(N * N);  // 0 — открытое место, >0 — id здания
const ground = new Uint8Array(N * N);  // 0 асфальт, 1 тротуар, 2 парк, 3 двор
const buildings = [null];
const wrapI = v => ((v % N) + N) % N;
const wrapF = v => v - N * Math.floor(v / N);
const tileAt = (x, y) => tiles[wrapI(y) * N + wrapI(x)];
const groundAt = (x, y) => ground[wrapI(y) * N + wrapI(x)];

function addBuilding(b, x, y, w, h) {
  const id = buildings.length;
  buildings.push(b);
  for (let yy = y; yy < y + h; yy++)
    for (let xx = x; xx < x + w; xx++) tiles[wrapI(yy) * N + wrapI(xx)] = id;
}

function generateCity(seed) {
  const rnd = mulberry32(seed);
  // дороги и тротуары
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const lx = x % B, ly = y % B, inV = lx < R, inH = ly < R;
    let g;
    if (inV && inH) g = 0;
    else if (inV) g = (lx === 0 || lx === R - 1) ? 1 : 0;
    else if (inH) g = (ly === 0 || ly === R - 1) ? 1 : 0;
    else g = 3;
    ground[y * N + x] = g;
  }
  // кварталы делятся на 1–4 участка
  const nb = N / B, S = B - R;
  for (let by = 0; by < nb; by++) for (let bx = 0; bx < nb; bx++) {
    const x0 = bx * B + R, y0 = by * B + R;
    const sx = rnd() < 0.7 ? 3 + Math.floor(rnd() * (S - 5)) : S;
    const sy = rnd() < 0.7 ? 3 + Math.floor(rnd() * (S - 5)) : S;
    const xs = sx < S ? [[0, sx], [sx, S]] : [[0, S]];
    const ys = sy < S ? [[0, sy], [sy, S]] : [[0, S]];
    // ближе к «центру» карты — выше дома
    const dc = Math.hypot((bx + 0.5) / nb - 0.5, (by + 0.5) / nb - 0.5);
    const central = Math.max(0, 1 - dc * 2.2);
    for (const [ya, yb] of ys) for (const [xa, xb] of xs) {
      const lx = x0 + xa, ly = y0 + ya, w = xb - xa, h = yb - ya;
      if (rnd() < 0.08) { // парк с деревьями
        for (let yy = ly; yy < ly + h; yy++) for (let xx = lx; xx < lx + w; xx++) {
          ground[wrapI(yy) * N + wrapI(xx)] = 2;
          if (rnd() < 0.3) addBuilding({ kind: 'tree', h: 0.25 + rnd() * 0.25, hue: P.GREEN, seed: rnd() * 1e9 | 0 }, xx, yy, 1, 1);
        }
        continue;
      }
      let height = 0.7 + rnd() * 2.3;
      if (rnd() < 0.12 + central * 0.45) height = 3.5 + rnd() * 11 * (0.4 + central);
      height = Math.max(2, Math.round(height / CONFIG.floorH)) * CONFIG.floorH;
      const hue = BUILDING_HUES[rnd() * BUILDING_HUES.length | 0];
      let sign = null;
      if (height > 1.2 && rnd() < 0.45) {
        const word = SIGN_WORDS[rnd() * SIGN_WORDS.length | 0];
        const lh = 0.13;
        const zTop = Math.min(height - 0.15, 0.5 + word.length * lh + rnd() * Math.max(0, height - 1.5 - word.length * lh));
        sign = { word, lh, zTop, every: 5 + (rnd() * 6 | 0), hue: BUILDING_HUES[rnd() * BUILDING_HUES.length | 0], blink: rnd() < 0.3 };
      }
      addBuilding({ kind: 'building', h: height, hue, lit: 0.12 + rnd() * 0.38, seed: rnd() * 1e9 | 0, sign, trim: rnd() < 0.6 }, lx, ly, w, h);
    }
  }
}

// ---------------------------------------------------------------- ИГРОК
const player = { x: 2 * B + 0.5, y: 2 * B + R + 1.5, a: Math.PI / 2, pitch: 0 };
let dirX, dirY, planeX, planeY, rightX, rightY;

function blocked(x, y) {
  const r = 0.1;
  return tileAt(Math.floor(x - r), Math.floor(y - r)) || tileAt(Math.floor(x + r), Math.floor(y - r)) ||
         tileAt(Math.floor(x - r), Math.floor(y + r)) || tileAt(Math.floor(x + r), Math.floor(y + r));
}

// ---------------------------------------------------------------- МАШИНЫ И ЛЮДИ
const cars = [], peds = [];
function spawnAgents(seed) {
  const rnd = mulberry32(seed ^ 0x9e3779b9);
  const nb = N / B;
  const carColors = [P.WHITE, P.RED, P.BLUE, P.AMBER, P.CYAN, P.PINK, P.ASPHALT];
  for (let i = 0; i < CONFIG.cars; i++) {
    const dir = rnd() < 0.5 ? 1 : -1;
    cars.push({
      axis: rnd() < 0.5 ? 'h' : 'v',
      fixed: (rnd() * nb | 0) * B + (dir > 0 ? 1.5 : 2.5),  // полоса по направлению движения
      t: rnd() * N, v: (2.5 + rnd() * 3.5) * dir,
      color: carColors[rnd() * carColors.length | 0],
    });
  }
  for (let i = 0; i < CONFIG.peds; i++) {
    const dir = rnd() < 0.5 ? 1 : -1;
    peds.push({
      axis: rnd() < 0.5 ? 'h' : 'v',
      fixed: (rnd() * nb | 0) * B + (rnd() < 0.5 ? 0.5 : R - 0.5),  // по тротуару
      t: rnd() * N, v: (0.18 + rnd() * 0.22) * dir,
      color: BUILDING_HUES[rnd() * BUILDING_HUES.length | 0], phase: rnd() * 10,
    });
  }
}
const agentPos = a => a.axis === 'h' ? [a.t, a.fixed] : [a.fixed, a.t];
const agentVel = a => a.axis === 'h' ? [a.v, 0] : [0, a.v];

// ---------------------------------------------------------------- ЭКРАН
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const glowCanvas = document.getElementById('glow');
const gctx = glowCanvas.getContext('2d');

let W, H, cw, ch, cols, rows, fontPx, offX, offY;
let chars, pals, lvls, depthBuf;
let planeLen, projX, projY, horizon;
let atlas, actx, glyphCache, atlasNext, atlasCols, atlasRows;

function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  glowCanvas.width = Math.max(1, W >> 1); glowCanvas.height = Math.max(1, H >> 1);
  cw = Math.max(5, Math.floor(W / CONFIG.targetCols));
  fontPx = Math.max(8, Math.round(cw / 0.6));
  ch = fontPx;
  cols = Math.floor(W / cw); rows = Math.floor(H / ch);
  offX = (W - cols * cw) >> 1; offY = (H - rows * ch) >> 1;
  const n = cols * rows;
  chars = new Uint16Array(n); pals = new Uint8Array(n); lvls = new Uint8Array(n); depthBuf = new Float32Array(n);
  planeLen = Math.tan(CONFIG.fov / 2);
  projX = (cols / 2) / planeLen;
  projY = projX * cw / ch;          // ячейки не квадратные — компенсируем
  resetAtlas();
}

// Атлас глифов: каждая пара (символ, цвет, яркость) рисуется один раз,
// дальше копируется drawImage — это в разы быстрее fillText на каждую ячейку.
function resetAtlas() {
  atlas = document.createElement('canvas');
  atlas.width = 2048; atlas.height = 2048;
  actx = atlas.getContext('2d');
  actx.font = `${fontPx}px Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace`;
  actx.textAlign = 'center'; actx.textBaseline = 'middle';
  glyphCache = new Map(); atlasNext = 0;
  atlasCols = Math.floor(2048 / cw); atlasRows = Math.floor(2048 / ch);
}
function glyph(c, pal, lvl) {
  const key = c * 4096 + pal * 16 + lvl;
  let s = glyphCache.get(key);
  if (s !== undefined) return s;
  if (atlasNext >= atlasCols * atlasRows) resetAtlas();
  s = atlasNext++;
  const sx = (s % atlasCols) * cw, sy = ((s / atlasCols) | 0) * ch;
  const p = PALETTE[pal], k = lvl / 15;
  actx.fillStyle = `rgb(${p[0] * k | 0},${p[1] * k | 0},${p[2] * k | 0})`;
  actx.save();
  actx.beginPath(); actx.rect(sx, sy, cw, ch); actx.clip();
  switch (c) { // блочные символы рисуем прямоугольниками — одинаково в любом шрифте
    case 0x2588: actx.fillRect(sx, sy, cw, ch); break;                       // █
    case 0x2584: actx.fillRect(sx, sy + (ch >> 1), cw, ch - (ch >> 1)); break; // ▄
    case 0x2580: actx.fillRect(sx, sy, cw, ch >> 1); break;                   // ▀
    default: actx.fillText(String.fromCharCode(c), sx + cw / 2, sy + ch / 2 + 1);
  }
  actx.restore();
  glyphCache.set(key, s);
  return s;
}

function put(i, c, pal, lvl, d) { chars[i] = c; pals[i] = pal; lvls[i] = clampLvl(lvl); depthBuf[i] = d; }

// ---------------------------------------------------------------- «ШЕЙДЕРЫ»
let time = 0;
const MOON_AZ = 0.9;

function fogK(d) { const f = 1 - d / CONFIG.maxDist; return f <= 0 ? 0 : Math.pow(f, 1.25); }

function shadeSky(i, r, angCol, ang) {
  const relRow = Math.round(horizon) - r;            // целое, стабильно при наклоне головы
  // луна
  let da = ang - MOON_AZ; da -= Math.PI * 2 * Math.round(da / (Math.PI * 2));
  const dx = da * cols / CONFIG.fov, dy = (relRow - rows * 0.42) * ch / cw;
  if (dx * dx + dy * dy < 30) {
    const m = G.moon[hash3(Math.round(dx), relRow, 5) * G.moon.length | 0];
    put(i, code(m), P.WARM, 10 + (dx < 0 ? 2 : 0), Infinity); return;
  }
  const hs = hash3(angCol, relRow, 99);
  if (hs < 0.006) {
    const tw = 0.5 + 0.5 * Math.sin(time * 3 + angCol * 1.7);
    put(i, code(G.star[hs * 500 | 0] || '.'), P.WHITE, 5 + 8 * tw, Infinity); return;
  }
  const glow = 1 - (horizon - r) / (rows * 0.4);    // дымка над горизонтом
  if (glow > 0 && hs < glow * 0.3) { put(i, code(G.skyHaze), P.SKY, 2 + glow * 6, Infinity); return; }
  put(i, SPACE, 0, 0, Infinity);
}

function shadeFloor(i, wx, wy, d) {
  const f = fogK(d);
  if (f <= 0) { put(i, SPACE, 0, 0, Infinity); return; }
  const g = groundAt(Math.floor(wx), Math.floor(wy));
  const lx = wrapF(wx) % B, ly = wrapF(wy) % B;
  const inV = lx < R, inH = ly < R;
  if (g === 0) {
    if (inV && !inH && Math.abs(lx - R / 2) < 0.06 && (Math.floor(ly * 1.5) & 1)) return put(i, code(G.laneV), P.AMBER, 11 * f, Infinity);
    if (inH && !inV && Math.abs(ly - R / 2) < 0.06 && (Math.floor(lx * 1.5) & 1)) return put(i, code(G.laneH), P.AMBER, 11 * f, Infinity);
    if (inV && !inH && (ly < R + 0.8 || ly > B - 0.8) && frac(lx * 3) < 0.5) return put(i, code(G.zebra), P.WHITE, 9 * f, Infinity);
    if (inH && !inV && (lx < R + 0.8 || lx > B - 0.8) && frac(ly * 3) < 0.5) return put(i, code(G.zebra), P.WHITE, 9 * f, Infinity);
    const h = hash3(Math.floor(wx * 14), Math.floor(wy * 14), 7);
    // мокрый асфальт: изредка отблески неона
    if (h < 0.012 && d > 1.5) return put(i, code(','), BUILDING_HUES[h * 660 | 0], 9 * f, Infinity);
    if (h < 0.12) return put(i, code(G.asphalt), P.ASPHALT, 4 * f, Infinity);
    return put(i, SPACE, 0, 0, Infinity);
  }
  if (g === 1) {
    const seam = frac(wx) < 0.08 || frac(wy) < 0.08;
    return put(i, code(seam ? G.sidewalkSeam : G.sidewalk), P.WHITE, (seam ? 4 : 3) * f, Infinity);
  }
  if (g === 2) {
    const h = hash3(Math.floor(wx * 4), Math.floor(wy * 4), 3);
    return put(i, code(G.grass[h < 0.5 ? 0 : 1]), P.GREEN, (3 + h * 3) * f, Infinity);
  }
  put(i, code('.'), P.WHITE, 2 * f, Infinity);
}

function shadeFacade(i, b, z, u, d, side) {
  const f = fogK(d) * (side ? 0.8 : 1);
  if (b.kind === 'tree') {
    const h = hash3(Math.floor(u * 6), Math.floor(z * 20), b.seed);
    return put(i, code(G.tree[h * G.tree.length | 0]), P.GREEN, (5 + h * 6) * f, d);
  }
  if (b.trim && z > b.h - 0.05) return put(i, code(G.trim), b.hue, 14 * f, d);       // неон по крыше
  const uu = u * 3, wc = Math.floor(uu), fx = uu - wc;
  const s = b.sign;
  if (s && ((wc % s.every) + s.every) % s.every === 0 && z < s.zTop && z > s.zTop - s.word.length * s.lh) {
    const li = Math.floor((s.zTop - z) / s.lh);
    const on = !s.blink || Math.sin(time * 4 + b.seed) > -0.6;
    return put(i, code(s.word[li]), s.hue, (on ? 15 : 4) * fogK(d), d);               // вертикальная вывеска
  }
  const fz = z / CONFIG.floorH, floorIdx = Math.floor(fz), ffz = fz - floorIdx;
  if (ffz < 0.14) return put(i, code(G.slab), b.hue, 3 * f, d);                       // перекрытие
  if (floorIdx === 0 && fx > 0.12 && fx < 0.92 && ffz > 0.3) {                                     // витрины 1-го этажа
    const on = hash3(wc, 0, b.seed) < 0.45;
    return put(i, code(G.shop), on ? b.hue : P.WHITE, (on ? 12 : 2) * f, d);
  }
  if (fx > 0.18 && fx < 0.82 && ffz > 0.3) {                                           // окна
    const hv = hash3(b.seed + wc, floorIdx, side);
    let lit = hv < b.lit;
    if (hv < 0.02) lit = Math.sin(time * 7 + wc * 3.1) > 0.2;                          // мигающие
    if (lit) {
      const warm = hash3(wc, floorIdx, b.seed) < 0.6;
      return put(i, code(warm ? G.lit : G.litAlt), warm ? P.WARM : b.hue, (10 + hv * 8) * f, d);
    }
    return put(i, code(G.dark), b.hue, 2 * f, d);
  }
  put(i, code(fx < 0.1 ? G.pillar : G.wall), b.hue, (fx < 0.1 ? 4 : 2) * f, d);
}

// ---------------------------------------------------------------- RAYCASTING
function castColumn(x) {
  const camX = 2 * (x + 0.5) / cols - 1;
  const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
  const ang = player.a + Math.atan(camX * planeLen);
  const angN = ang - Math.PI * 2 * Math.floor(ang / (Math.PI * 2));
  const angCol = Math.floor(angN * cols / CONFIG.fov);

  // 1) небо и земля на весь столбец
  for (let r = 0; r < rows; r++) {
    const i = r * cols + x, dy = r + 0.5 - horizon;
    if (dy <= 0) shadeSky(i, r, angCol, angN);
    else {
      const rowDist = CONFIG.eye * projY / dy;
      shadeFloor(i, player.x + rdx * rowDist, player.y + rdy * rowDist, rowDist);
    }
  }

  // 2) DDA по сетке: фасады спереди назад, дальние видны только над ближними
  const px = player.x, py = player.y;
  let mapX = Math.floor(px), mapY = Math.floor(py);
  const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
  let stepX, stepY, sdx, sdy;
  if (rdx < 0) { stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
  if (rdy < 0) { stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
  let prevId = tileAt(mapX, mapY), prevH = prevId ? buildings[prevId].h : 0;
  let yLimit = rows, perp = 0, side = 0;
  for (let step = 0; step < 400; step++) {
    if (sdx < sdy) { perp = sdx; sdx += ddx; mapX += stepX; side = 0; }
    else { perp = sdy; sdy += ddy; mapY += stepY; side = 1; }
    if (perp > CONFIG.maxDist) break;
    const id = tileAt(mapX, mapY);
    if (id === prevId) continue;
    if (id) {
      const b = buildings[id];
      if (b.h > prevH && perp > 0.001) {
        const top = horizon - (b.h - CONFIG.eye) * projY / perp;
        const bottom = horizon + CONFIG.eye * projY / perp;
        const r0 = Math.max(0, Math.ceil(top - 0.5));
        const r1 = Math.min(yLimit, Math.floor(bottom - 0.5) + 1);
        const u = side === 0 ? py + perp * rdy : px + perp * rdx;   // координата вдоль стены
        for (let r = r0; r < r1; r++) {
          const z = CONFIG.eye + (horizon - (r + 0.5)) * perp / projY;
          shadeFacade(r * cols + x, b, z, u, perp, side);
        }
        if (r0 < yLimit) yLimit = r0;
      }
    }
    prevId = id; prevH = id ? buildings[id].h : 0;
    if (yLimit <= 0) break;
  }
}

// ---------------------------------------------------------------- СПРАЙТЫ
function drawSprite(sx, sy, w, h, shader, obj) {
  let rx = sx - player.x, ry = sy - player.y;
  rx -= N * Math.round(rx / N); ry -= N * Math.round(ry / N);      // мир зациклен
  const depth = rx * dirX + ry * dirY;
  if (depth < 0.25 || depth > CONFIG.maxDist) return;
  const lat = rx * rightX + ry * rightY;
  const cx = cols / 2 + lat * projX / depth, halfW = (w / 2) * projX / depth;
  const top = horizon - (h - CONFIG.eye) * projY / depth;
  const bot = horizon + CONFIG.eye * projY / depth;
  const c0 = Math.max(0, Math.ceil(cx - halfW - 0.5)), c1 = Math.min(cols, Math.floor(cx + halfW - 0.5) + 1);
  const r0 = Math.max(0, Math.ceil(top - 0.5)), r1 = Math.min(rows, Math.floor(bot - 0.5) + 1);
  const f = fogK(depth);
  for (let c = c0; c < c1; c++) for (let r = r0; r < r1; r++) {
    const i = r * cols + c;
    if (depth >= depthBuf[i]) continue;
    const u = (c + 0.5 - (cx - halfW)) / (2 * halfW), v = (r + 0.5 - top) / (bot - top);
    shader(i, u, v, f, depth, obj, rx, ry);
  }
}

function carShader(i, u, v, f, d, car, rx, ry) {
  const [vx, vy] = agentVel(car);
  const toward = vx * rx + vy * ry < 0;              // едет на камеру → фары, от камеры → стопы
  if (v < 0.4) { if (u > 0.2 && u < 0.8) put(i, 0x2584, P.ASPHALT, 5 * f, d); return; }
  if (v > 0.5 && (u < 0.22 || u > 0.78)) return put(i, code('o'), toward ? P.WARM : P.RED, 15 * f, d);
  put(i, 0x2588, car.color, 7 * f, d);
}

function pedShader(i, u, v, f, d, p) {
  if (v < 0.22) return put(i, code('o'), P.WHITE, 9 * f, d);
  if (v < 0.65) return put(i, code('#'), p.color, 9 * f, d);
  const step = (Math.floor(time * 5 + p.phase) & 1);
  put(i, code(step ? (u < 0.5 ? '/' : '\\') : '|'), P.ASPHALT, 8 * f, d);
}

function drawAgents() {
  const list = [];
  for (const c of cars) { const [x, y] = agentPos(c); list.push([x, y, 0.42, 0.2, carShader, c]); }
  for (const p of peds) { const [x, y] = agentPos(p); list.push([x, y, 0.07, 0.18, pedShader, p]); }
  for (const s of list) {
    let rx = s[0] - player.x, ry = s[1] - player.y;
    rx -= N * Math.round(rx / N); ry -= N * Math.round(ry / N);
    s.depth = rx * dirX + ry * dirY;
  }
  list.sort((a, b) => b.depth - a.depth);           // от дальних к ближним
  for (const s of list) drawSprite(s[0], s[1], s[2], s[3], s[4], s[5]);
}

// ---------------------------------------------------------------- ДОЖДЬ И UI
const rain = [];
function initRain() {
  rain.length = 0;
  for (let k = 0; k < CONFIG.rainDrops; k++) rain.push({ x: Math.random(), y: Math.random() * 1.2 - 0.2, v: 0.8 + Math.random() * 0.8 });
}
function drawRain(dt) {
  for (const d of rain) {
    d.y += d.v * dt;
    if (d.y > 1) { d.y = -0.1 * Math.random(); d.x = Math.random(); }
    const c = Math.floor(d.x * cols), r = Math.floor(d.y * rows);
    if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
    const i = r * cols + c;
    put(i, code(G.rain), P.CYAN, 5 * d.v, depthBuf[i]);
  }
}

function text(x, y, str, pal, lvl) {
  if (y < 0 || y >= rows) return;
  for (let k = 0; k < str.length; k++) {
    const xx = x + k;
    if (xx < 0 || xx >= cols) continue;
    put(y * cols + xx, str.charCodeAt(k), pal, lvl, 0);
  }
}

function drawMinimap() {
  const tw = 21, th = 21, mw = tw * 2 + 2, mh = th + 2;
  const x0 = cols - mw - 1, y0 = 1;
  if (x0 < 0 || y0 + mh > rows) return;
  for (let yy = 0; yy < mh; yy++) for (let xx = 0; xx < mw; xx++) {
    const edgeY = yy === 0 || yy === mh - 1, edgeX = xx === 0 || xx === mw - 1;
    const c = edgeY && edgeX ? '+' : edgeY ? '-' : edgeX ? '|' : ' ';
    put((y0 + yy) * cols + x0 + xx, code(c), P.CYAN, 8, 0);
  }
  const pxI = Math.floor(player.x), pyI = Math.floor(player.y);
  for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
    const wx = pxI + tx - (tw >> 1), wy = pyI + ty - (th >> 1);
    const id = tileAt(wx, wy), g = groundAt(wx, wy);
    let c = ' ', pal = 0, l = 0;
    if (id) { const b = buildings[id]; c = b.kind === 'tree' ? '&' : '#'; pal = b.hue; l = b.kind === 'tree' ? 7 : 4 + Math.min(11, b.h); }
    else if (g === 1) { c = '.'; pal = P.WHITE; l = 4; }
    else if (g === 2) { c = ','; pal = P.GREEN; l = 5; }
    for (let k = 0; k < 2; k++) put((y0 + 1 + ty) * cols + x0 + 1 + tx * 2 + k, code(c), pal, l, 0);
  }
  for (const car of cars) {
    const [x, y] = agentPos(car);
    let dx = x - player.x, dy = y - player.y;
    dx -= N * Math.round(dx / N); dy -= N * Math.round(dy / N);
    const tx = Math.floor(player.x + dx) - pxI + (tw >> 1), ty = Math.floor(player.y + dy) - pyI + (th >> 1);
    if (tx >= 0 && tx < tw && ty >= 0 && ty < th) put((y0 + 1 + ty) * cols + x0 + 1 + tx * 2, code('c'), car.color, 15, 0);
  }
  const cxm = x0 + 1 + (tw >> 1) * 2, cym = y0 + 1 + (th >> 1);
  put(cym * cols + cxm, code('@'), P.AMBER, 15, 0);
  const ax = Math.round(dirX * 1.4), ay = Math.round(dirY * 1.4);
  put((cym + ay) * cols + cxm + ax * 2, code('*'), P.AMBER, 12, 0);
}

// ---------------------------------------------------------------- ВВОД
const keys = new Set();
let showMap = false, rainOn = true, glowOn = true, showHelp = true, locked = false;
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyM') showMap = !showMap;
  if (e.code === 'KeyR') rainOn = !rainOn;
  if (e.code === 'KeyG') { glowOn = !glowOn; glowCanvas.style.display = glowOn ? '' : 'none'; }
  if (e.code === 'KeyH') showHelp = !showHelp;
});
addEventListener('keyup', e => keys.delete(e.code));
canvas.addEventListener('click', () => canvas.requestPointerLock && canvas.requestPointerLock());
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; });
addEventListener('mousemove', e => {
  if (!locked) return;
  player.a += e.movementX * CONFIG.mouseSens;
  player.pitch = Math.max(-rows * 0.9, Math.min(rows * 0.9, player.pitch - e.movementY * 0.12));
});
// простое тач-управление: левая половина — идти, правая — смотреть
let touchMove = null, touchLook = null;
addEventListener('touchstart', e => { for (const t of e.changedTouches) { if (t.clientX < innerWidth / 2) touchMove = { id: t.identifier, x: t.clientX, y: t.clientY, dx: 0, dy: 0 }; else touchLook = { id: t.identifier, x: t.clientX, y: t.clientY }; } }, { passive: true });
addEventListener('touchmove', e => { for (const t of e.changedTouches) {
  if (touchMove && t.identifier === touchMove.id) { touchMove.dx = t.clientX - touchMove.x; touchMove.dy = t.clientY - touchMove.y; }
  if (touchLook && t.identifier === touchLook.id) { player.a += (t.clientX - touchLook.x) * 0.006; player.pitch = Math.max(-rows * 0.9, Math.min(rows * 0.9, player.pitch - (t.clientY - touchLook.y) * 0.2)); touchLook.x = t.clientX; touchLook.y = t.clientY; }
} }, { passive: true });
addEventListener('touchend', e => { for (const t of e.changedTouches) { if (touchMove && t.identifier === touchMove.id) touchMove = null; if (touchLook && t.identifier === touchLook.id) touchLook = null; } });

// ---------------------------------------------------------------- ЦИКЛ
function update(dt) {
  time += dt;
  if (keys.has('ArrowLeft')) player.a -= CONFIG.turnSpeed * dt;
  if (keys.has('ArrowRight')) player.a += CONFIG.turnSpeed * dt;
  dirX = Math.cos(player.a); dirY = Math.sin(player.a);
  rightX = -dirY; rightY = dirX;
  planeX = rightX * planeLen; planeY = rightY * planeLen;

  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD')) s += 1;
  if (keys.has('KeyA')) s -= 1;
  if (touchMove) { f = Math.max(-1, Math.min(1, -touchMove.dy / 60)); s = Math.max(-1, Math.min(1, touchMove.dx / 60)); }
  const sp = CONFIG.walkSpeed * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? CONFIG.runMul : 1) * dt;
  const mx = (dirX * f + rightX * s) * sp, my = (dirY * f + rightY * s) * sp;
  if (!blocked(player.x + mx, player.y)) player.x += mx;
  if (!blocked(player.x, player.y + my)) player.y += my;

  for (const a of cars) a.t = wrapF(a.t + a.v * dt);
  for (const a of peds) a.t = wrapF(a.t + a.v * dt);
}

let fps = 60, lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
  update(dt);

  horizon = rows * 0.5 + player.pitch;
  for (let x = 0; x < cols; x++) castColumn(x);
  drawAgents();
  if (rainOn) drawRain(dt);
  if (showMap) drawMinimap();

  text(1, 0, ' ASCII CITY // prototype 0.1 ', P.CYAN, 14);
  text(31, 0, `${fps | 0} fps  ${cols}x${rows}`, P.WHITE, 7);
  if (showHelp) text(1, rows - 1, ' WASD идти · мышь смотреть (клик) · Shift бег · M карта · R дождь · G свечение · H скрыть ', P.AMBER, 10);
  if (!locked && Math.floor(time * 2) % 2 === 0 && !('ontouchstart' in window))
    text((cols >> 1) - 17, rows >> 1, '[ кликни, чтобы смотреть мышью ]', P.PINK, 15);

  present();
  requestAnimationFrame(frame);
}

function present() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const n = cols * rows;
  for (let i = 0; i < n; i++) {
    const c = chars[i], l = lvls[i];
    if (c === SPACE || l === 0) continue;
    const s = glyph(c, pals[i], l);
    ctx.drawImage(atlas, (s % atlasCols) * cw, ((s / atlasCols) | 0) * ch, cw, ch,
                  offX + (i % cols) * cw, offY + ((i / cols) | 0) * ch, cw, ch);
  }
  if (glowOn) {
    gctx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
    gctx.drawImage(canvas, 0, 0, glowCanvas.width, glowCanvas.height);
  }
}

// ---------------------------------------------------------------- СТАРТ
generateCity(CONFIG.seed);
spawnAgents(CONFIG.seed);
initRain();
resize();
addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
